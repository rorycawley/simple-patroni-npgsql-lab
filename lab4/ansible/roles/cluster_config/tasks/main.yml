---
- name: Set the node hostname
  ansible.builtin.hostname:
    name: "{{ lab4_node_fqdn }}"

- name: Configure cluster hostname resolution inside the VMs
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} simple-patroni-npgsql-lab lab4"
    block: |
      {% for host in groups['patroni_nodes'] %}
      {{ hostvars[host].lab4_node_ip }} {{ hostvars[host].lab4_node_fqdn }} {{ hostvars[host].lab4_node_name }}
      {% endfor %}

- name: Create cluster service directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ lab4_etcd_data_dir }}", owner: etcd, group: etcd, mode: "0700" }
    - { path: /etc/systemd/system/etcd.service.d, owner: root, group: root, mode: "0755" }
    - { path: /etc/patroni, owner: postgres, group: postgres, mode: "0700" }
    - { path: /etc/pgbackrest, owner: postgres, group: postgres, mode: "0750" }
    - { path: "{{ lab4_postgres_data_dir }}", owner: postgres, group: postgres, mode: "0700" }
    - { path: /var/lib/pgbackrest, owner: postgres, group: postgres, mode: "0750" }
    - { path: /var/log/pgbackrest, owner: postgres, group: postgres, mode: "0750" }
    # The restore volume's mount point. pgBackRest restores into it as postgres,
    # and 0700 because what lands there is a complete copy of production.
    - { path: "{{ lab4_restore_dir }}", owner: postgres, group: postgres, mode: "0700" }

- name: Configure etcd
  ansible.builtin.template:
    src: etcd.conf.yaml.j2
    dest: /etc/etcd/etcd.conf.yaml
    owner: etcd
    group: etcd
    mode: "0600"

- name: Make the packaged etcd service use the Lab 4 configuration
  ansible.builtin.template:
    src: etcd-override.conf.j2
    dest: /etc/systemd/system/etcd.service.d/override.conf
    owner: root
    group: root
    mode: "0644"

- name: Load softdog now
  ansible.builtin.command: modprobe softdog
  changed_when: false

- name: Load softdog after VM boots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/softdog.conf
    content: "softdog\n"
    owner: root
    group: root
    mode: "0644"

- name: Give Patroni access to watchdog devices after boot
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-patroni-watchdog.rules
    content: |
      KERNEL=="watchdog*", OWNER="postgres", GROUP="postgres", MODE="0600"
    owner: root
    group: root
    mode: "0644"

- name: Apply watchdog device ownership now
  ansible.builtin.file:
    path: /dev/watchdog
    owner: postgres
    group: postgres
    mode: "0600"

- name: Configure Patroni
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true

- name: Render the desired Patroni distributed configuration
  ansible.builtin.template:
    src: patroni-dcs.yml.j2
    dest: /etc/patroni/dcs.yml
    owner: postgres
    group: postgres
    mode: "0600"

# 0600, not 0640: this file now holds the object-store secret key and the
# repository cipher passphrase. It is read by pgBackRest, which runs as postgres.
- name: Configure pgBackRest
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0600"

- name: Install the Patroni systemd unit
  ansible.builtin.template:
    src: percona-patroni.service.j2
    dest: /etc/systemd/system/percona-patroni.service
    owner: root
    group: root
    mode: "0644"

# SELinux must be Enforcing before the services start, and the image does not
# guarantee it. The Rocky cloud image reaches Enforcing only after its first-boot
# relabel and the reboot that follows, so whether a build finds it Enforcing
# depends on timing rather than configuration -- which is exactly how it passed
# seven consecutive builds and then failed on two nodes of the eighth.
#
# Relabel first, then enforce. Setting Enforcing over unlabelled files would
# deny the services their own data directories, and on Lab 4 those directories
# are freshly created filesystems on the LUKS volumes, which carry no labels at
# all until restorecon runs.
- name: Restore SELinux contexts on the paths this lab creates
  ansible.builtin.command: restorecon -R -F /var/lib/pgsql /var/lib/etcd /etc/patroni /etc/lab4
  changed_when: false
  failed_when: false

- name: Read the current SELinux mode
  ansible.builtin.command: getenforce
  register: lab4_selinux_now
  changed_when: false

- name: Put SELinux into Enforcing mode
  ansible.builtin.command: setenforce 1
  when: (lab4_selinux_now.stdout | trim) == 'Permissive'
  changed_when: true

- name: Assert SELinux is Enforcing before the services start
  ansible.builtin.command: getenforce
  register: lab4_selinux_after
  changed_when: false
  failed_when: (lab4_selinux_after.stdout | trim) != 'Enforcing'

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Keep raw PostgreSQL disabled
  ansible.builtin.systemd:
    name: postgresql-18
    enabled: false
    state: stopped
