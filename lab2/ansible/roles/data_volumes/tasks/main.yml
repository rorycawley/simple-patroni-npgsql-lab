---
# Puts each service's data directory on its own block device.
#
# Lima does not hand these over raw: it partitions each additional disk, formats
# it ext4 and mounts it under /mnt/lima-<disk>, with no /etc/fstab entry. So the
# first thing to do is take the device back.
#
# Devices are identified by size, not by attachment order or kernel name, since
# neither is a contract. The sizes are required to be distinct.

- name: Resolve each data volume to a block device by size
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -bdno NAME,SIZE --nodeps | awk -v want="{{ (item.gib | int) * 1024 * 1024 * 1024 }}" '
      $2 >= want * 0.98 && $2 <= want * 1.02 { print "/dev/" $1 }'
  args:
    executable: /bin/bash
  register: lab2_volume_devices
  changed_when: false
  loop: "{{ lab2_data_volumes }}"
  loop_control:
    label: "{{ item.name }} ({{ item.gib }}GiB)"

- name: Assert exactly one device matched each volume
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | length) == 1
    fail_msg: >-
      Expected exactly one {{ item.item.gib }}GiB device for {{ item.item.name }},
      found {{ item.stdout_lines | length }}. Data volume sizes must be distinct
      from each other and from the root disk.
  loop: "{{ lab2_volume_devices.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Build the volume-to-device map
  ansible.builtin.set_fact:
    lab2_volumes: "{{ lab2_volumes | default([]) + [item.item | combine({'device': item.stdout_lines[0]})] }}"
  loop: "{{ lab2_volume_devices.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.stdout_lines[0] }}"

- name: Take each device back from Lima and format it
  ansible.builtin.shell: |
    set -o pipefail
    device="{{ item.device }}"
    for mounted in $(findmnt -rno TARGET,SOURCE | awk -v d="$device" '$2 ~ "^"d {print $1}'); do
      umount "$mounted"
    done
    # Reformat only when the whole device is not already our filesystem, so a
    # rerun against a populated cluster cannot destroy it.
    if [ "$(lsblk -dno FSTYPE "$device")" != "{{ lab2_volume_fstype }}" ]; then
      wipefs -a "$device"
      mkfs.{{ lab2_volume_fstype }} -q -f "$device"
      echo formatted
    fi
  args:
    executable: /bin/bash
  register: lab2_volume_format
  changed_when: "'formatted' in lab2_volume_format.stdout"
  loop: "{{ lab2_volumes }}"
  loop_control:
    label: "{{ item.name }} on {{ item.device }}"

- name: Read each volume's filesystem UUID
  ansible.builtin.command: "blkid -s UUID -o value {{ item.device }}"
  register: lab2_volume_uuids
  changed_when: false
  loop: "{{ lab2_volumes }}"
  loop_control:
    label: "{{ item.name }}"

# Mounting by UUID rather than /dev/vdX, because kernel names depend on
# enumeration order and would silently swap the two volumes.
- name: Mount each data volume by UUID and persist it in fstab
  ansible.posix.mount:
    path: "{{ item.0.path }}"
    src: "UUID={{ item.1.stdout | trim }}"
    fstype: "{{ lab2_volume_fstype }}"
    opts: defaults
    state: mounted
  loop: "{{ lab2_volumes | zip(lab2_volume_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.path }} <- UUID={{ item.1.stdout | trim }}"
