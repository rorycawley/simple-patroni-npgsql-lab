---
- name: Start the three-member etcd cluster
  hosts: patroni_nodes
  become: true
  gather_facts: false
  strategy: free
  tasks:
    # A first bootstrap that fails after creating its data directory poisons
    # itself: initial-cluster-state is "new", so every Restart=on-failure retry
    # then dies with "member has already been bootstrapped" and never recovers.
    # Mutual peer TLS makes that first failure more likely, because the peer
    # handshake can fail while the other nodes are still coming up.
    #
    # Clearing is only safe when nothing was ever bootstrapped. An empty
    # PostgreSQL data directory is that discriminator: on a running cluster it
    # is populated and this does nothing, so a re-run of configure_cluster
    # cannot destroy a live etcd.
    - name: Look for a half-initialised etcd data directory
      ansible.builtin.shell: |
        set -o pipefail
        member="{{ lab2_etcd_data_dir }}/member"
        pgdata="{{ lab2_postgres_data_dir }}"
        if [ -d "$member" ] && [ ! -d "$member/wal" ] && [ -z "$(ls -A "$pgdata" 2>/dev/null)" ]; then
          echo poisoned
        fi
      args:
        executable: /bin/bash
      register: lab2_etcd_state
      changed_when: false

    - name: Clear a half-initialised etcd data directory
      ansible.builtin.file:
        path: "{{ lab2_etcd_data_dir }}/member"
        state: absent
      when: "'poisoned' in lab2_etcd_state.stdout"

    - name: Enable and start etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
      register: lab2_etcd_start
      failed_when: false

    # The pre-check above only sees corruption left by an earlier run. The
    # observed failure happened *during* this start: etcd created its data
    # directory, failed before writing a WAL, and every Restart=on-failure retry
    # then died on "already bootstrapped" with no way out. Recovery therefore
    # has to run after the attempt, not only before it.
    #
    # Why the first start failed is not established -- this recovers from the
    # symptom rather than fixing a known cause. Do not read the condition below
    # as a diagnosis.
    #
    # Scope, stated precisely: this repairs a FIRST bootstrap, where all three
    # members are forming a new cluster together. It deliberately cannot repair
    # a single node rejoining an established etcd cluster -- that needs
    # `etcdctl member add` and initial-cluster-state: existing, and silently
    # wiping a member in that situation would be the wrong action. The empty
    # PostgreSQL data directory is what distinguishes the two.
    - name: Detect an etcd that poisoned its own data directory while starting
      ansible.builtin.shell: |
        set -o pipefail
        member="{{ lab2_etcd_data_dir }}/member"
        pgdata="{{ lab2_postgres_data_dir }}"
        if systemctl is-active --quiet etcd; then exit 0; fi
        journalctl -u etcd --no-pager -n 50 2>/dev/null | grep -q "has already been bootstrapped" || exit 0
        # Only ever safe when nothing was bootstrapped: on a live cluster the
        # PostgreSQL data directory is populated and this refuses to act.
        [ -z "$(ls -A "$pgdata" 2>/dev/null)" ] || exit 0
        [ ! -d "$member/wal" ] || exit 0
        echo poisoned
      args:
        executable: /bin/bash
      register: lab2_etcd_poisoned
      changed_when: false

    - name: Clear the poisoned data directory and let etcd bootstrap cleanly
      when: "'poisoned' in lab2_etcd_poisoned.stdout"
      block:
        - name: Stop the failing etcd
          ansible.builtin.systemd:
            name: etcd
            state: stopped

        - name: Remove the half-initialised member directory
          ansible.builtin.file:
            path: "{{ lab2_etcd_data_dir }}/member"
            state: absent

        - name: Clear the failure counter so systemd will start it again
          ansible.builtin.command: systemctl reset-failed etcd
          changed_when: true

        - name: Start etcd on a clean data directory
          ansible.builtin.systemd:
            name: etcd
            state: started

    - name: Assert etcd is running
      ansible.builtin.systemd:
        name: etcd
        state: started
      register: lab2_etcd_final
      until: lab2_etcd_final is succeeded
      retries: 5
      delay: 5

- name: Verify etcd quorum and all three endpoints
  hosts: lab2-pg1
  become: true
  gather_facts: false
  vars:
    lab2_etcd_endpoints: "{% for host in groups['patroni_nodes'] %}https://{{ hostvars[host].lab2_node_ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}"
  tasks:
    - name: Wait for every etcd endpoint to be healthy
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} endpoint health
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_health
      retries: 12
      delay: 5
      until: lab2_etcd_health.rc == 0
      changed_when: false

    - name: List etcd members
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} member list --write-out=table
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_members
      changed_when: false

    - name: Show etcd membership
      ansible.builtin.debug:
        var: lab2_etcd_members.stdout_lines
