---
- name: Start the three-member etcd cluster
  hosts: patroni_nodes
  become: true
  gather_facts: false
  strategy: free
  tasks:
    - name: Enable and start etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started

- name: Verify etcd quorum and all three endpoints
  hosts: lab2-pg1
  become: true
  gather_facts: false
  vars:
    lab2_etcd_endpoints: "{% for host in groups['patroni_nodes'] %}https://{{ hostvars[host].lab2_node_ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}"
  tasks:
    - name: Wait for every etcd endpoint to be healthy
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} endpoint health
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_health
      retries: 12
      delay: 5
      until: lab2_etcd_health.rc == 0
      changed_when: false

    - name: List etcd members
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} member list --write-out=table
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_members
      changed_when: false

    - name: Show etcd membership
      ansible.builtin.debug:
        var: lab2_etcd_members.stdout_lines
