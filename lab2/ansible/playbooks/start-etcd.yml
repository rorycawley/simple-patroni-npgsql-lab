---
- name: Start the three-member etcd cluster
  hosts: patroni_nodes
  become: true
  gather_facts: false
  strategy: free
  tasks:
    # A first bootstrap that fails after creating its data directory poisons
    # itself: initial-cluster-state is "new", so every Restart=on-failure retry
    # then dies with "member has already been bootstrapped" and never recovers.
    # Mutual peer TLS makes that first failure more likely, because the peer
    # handshake can fail while the other nodes are still coming up.
    #
    # Clearing is only safe when nothing was ever bootstrapped. An empty
    # PostgreSQL data directory is that discriminator: on a running cluster it
    # is populated and this does nothing, so a re-run of configure_cluster
    # cannot destroy a live etcd.
    - name: Look for a half-initialised etcd data directory
      ansible.builtin.shell: |
        set -o pipefail
        member="{{ lab2_etcd_data_dir }}/member"
        pgdata="{{ lab2_postgres_data_dir }}"
        if [ -d "$member" ] && [ ! -d "$member/wal" ] && [ -z "$(ls -A "$pgdata" 2>/dev/null)" ]; then
          echo poisoned
        fi
      args:
        executable: /bin/bash
      register: lab2_etcd_state
      changed_when: false

    - name: Clear a half-initialised etcd data directory
      ansible.builtin.file:
        path: "{{ lab2_etcd_data_dir }}/member"
        state: absent
      when: "'poisoned' in lab2_etcd_state.stdout"

    - name: Enable and start etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started

- name: Verify etcd quorum and all three endpoints
  hosts: lab2-pg1
  become: true
  gather_facts: false
  vars:
    lab2_etcd_endpoints: "{% for host in groups['patroni_nodes'] %}https://{{ hostvars[host].lab2_node_ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}"
  tasks:
    - name: Wait for every etcd endpoint to be healthy
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} endpoint health
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_health
      retries: 12
      delay: 5
      until: lab2_etcd_health.rc == 0
      changed_when: false

    - name: List etcd members
      ansible.builtin.command: >-
        etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} member list --write-out=table
      environment:
        ETCDCTL_API: "3"
      register: lab2_etcd_members
      changed_when: false

    - name: Show etcd membership
      ansible.builtin.debug:
        var: lab2_etcd_members.stdout_lines
