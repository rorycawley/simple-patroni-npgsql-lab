---
- name: Verify every Lab 2 cluster component
  hosts: patroni_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services and watchdog are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['firewalld.service'].state == 'running'
          - ansible_facts.services['etcd.service'].state == 'running'
          - ansible_facts.services['etcd.service'].status == 'enabled'
          - ansible_facts.services['percona-patroni.service'].state == 'running'
          - ansible_facts.services['percona-patroni.service'].status == 'enabled'
          - ansible_facts.services['postgresql-18.service'].status == 'disabled'
        fail_msg: One or more required services have an unexpected state.

    # Enforcing is the image default, which means nothing checks it. A node
    # left permissive would pass every other check in this suite.
    - name: Read the SELinux mode
      ansible.builtin.command: getenforce
      register: lab2_selinux_mode
      changed_when: false

    - name: Assert SELinux is enforcing
      ansible.builtin.assert:
        that:
          - lab2_selinux_mode.stdout | trim == 'Enforcing'
        fail_msg: "SELinux is '{{ lab2_selinux_mode.stdout | trim }}', expected Enforcing."

    - name: Read the active firewall default zone
      ansible.builtin.command: firewall-cmd --get-default-zone
      register: lab2_firewall_default_zone
      changed_when: false

    - name: Read broadly allowed firewall services
      ansible.builtin.command: firewall-cmd --zone=drop --list-services
      register: lab2_firewall_services
      changed_when: false

    - name: Read broadly allowed firewall ports
      ansible.builtin.command: firewall-cmd --zone=drop --list-ports
      register: lab2_firewall_ports
      changed_when: false

    - name: Read interfaces protected by the drop zone
      ansible.builtin.command: firewall-cmd --zone=drop --list-interfaces
      register: lab2_firewall_interfaces
      changed_when: false

    - name: Assert the firewall remains default-deny
      ansible.builtin.assert:
        that:
          - lab2_firewall_default_zone.stdout | trim == 'drop'
          - lab2_firewall_services.stdout | trim == ''
          - lab2_firewall_ports.stdout | trim == ''
          - "'eth0' in lab2_firewall_interfaces.stdout.split()"
          - "'lima0' in lab2_firewall_interfaces.stdout.split()"

    - name: Check watchdog device ownership
      ansible.builtin.stat:
        path: /dev/watchdog
      register: lab2_watchdog

    - name: Assert Patroni can access the watchdog device
      ansible.builtin.assert:
        that:
          - lab2_watchdog.stat.exists
          - lab2_watchdog.stat.pw_name == 'postgres'
          - lab2_watchdog.stat.mode == '0600'

- name: Verify etcd, Patroni, replication, and pgBackRest
  hosts: lab2-pg1
  become: true
  gather_facts: false
  vars:
    lab2_etcd_endpoints: "{% for host in groups['patroni_nodes'] %}https://{{ hostvars[host].lab2_node_ip }}:2379{% if not loop.last %},{% endif %}{% endfor %}"
  tasks:
    - name: Verify all etcd endpoints
      ansible.builtin.command: etcdctl {{ lab2_etcdctl_tls }} --endpoints={{ lab2_etcd_endpoints }} endpoint health
      environment:
        ETCDCTL_API: "3"
      changed_when: false

    - name: Read Patroni topology
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml list --format=json
      become_user: postgres
      register: lab2_patroni_topology
      changed_when: false

    - name: Assert one leader and two healthy replicas
      ansible.builtin.assert:
        that:
          - (lab2_patroni_topology.stdout | from_json | length) == 3
          - (lab2_patroni_topology.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | list | length) == 1
          - (lab2_patroni_topology.stdout | from_json | selectattr('State', 'equalto', 'streaming') | list | length) == 2

    - name: Identify the current primary inventory host
      ansible.builtin.set_fact:
        lab2_primary_inventory_host: >-
          lab2-{{ (lab2_patroni_topology.stdout | from_json
          | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first) }}

    # Page-level checksums are how PostgreSQL detects corruption before it is
    # replicated to every standby and copied faithfully into every backup. They
    # can only be set at initdb time, so a cluster built without them cannot
    # gain them later without a rebuild -- and PostgreSQL 18 enabling them by
    # default is exactly the kind of default that nothing checks and can drift.
    - name: Read data_checksums
      ansible.builtin.command: >-
        /usr/pgsql-18/bin/psql -Atc "show data_checksums"
      become_user: postgres
      register: lab2_checksums
      changed_when: false

    - name: Assert page checksums are enabled
      ansible.builtin.assert:
        that:
          - lab2_checksums.stdout | trim == 'on'
        fail_msg: >-
          data_checksums is '{{ lab2_checksums.stdout | trim }}', expected 'on'.
          Silent corruption would be replicated and backed up undetected, and
          this cannot be changed without rebuilding the cluster.

    - name: Check pgBackRest on the current primary
      ansible.builtin.command: pgbackrest --stanza={{ lab2_cluster_name }} check
      become_user: postgres
      register: lab2_pgbackrest_check
      changed_when: false
      delegate_to: "{{ lab2_primary_inventory_host }}"

    - name: Show Patroni topology
      ansible.builtin.debug:
        var: lab2_patroni_topology.stdout
