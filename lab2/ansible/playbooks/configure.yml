---
- name: Configure the Lab 2 cluster services
  hosts: patroni_nodes
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../.secrets/cluster.yml"

  pre_tasks:
    - name: Record the three node IP addresses
      ansible.builtin.set_fact:
        lab2_peer_ips: "{{ groups['patroni_nodes'] | map('extract', hostvars, 'lab2_node_ip') | list }}"
        lab2_host_gateway_ip: "{{ lab2_host_gateway_ip_override or (lab2_node_ip | regex_replace('\\.[0-9]+$', '.1')) }}"

  roles:
    # Before cluster_config, whose templates reference these paths.
    - role: tls_material
    - role: cluster_config
