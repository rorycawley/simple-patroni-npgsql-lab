---
- name: Configure the Lab 6 cluster services
  hosts: patroni_nodes
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../.secrets/cluster.yml"
    # Deliberately a separate file outside .secrets/: the repository passphrase
    # must outlive `make clean` and the cluster itself. See generate-secrets.sh.
    - "{{ playbook_dir }}/../../.recovery-inputs/repo.yml"

  pre_tasks:
    - name: Record the three node IP addresses
      ansible.builtin.set_fact:
        lab6_peer_ips: "{{ groups['patroni_nodes'] | map('extract', hostvars, 'lab6_node_ip') | list }}"
        lab6_host_gateway_ip: "{{ lab6_host_gateway_ip_override or (lab6_node_ip | regex_replace('\\.[0-9]+$', '.1')) }}"

  roles:
    # Before cluster_config, whose templates reference these paths.
    - role: tls_material
    - role: cluster_config
    # After cluster_config: the gate presents the patroni certificate that role
    # installs, and the job reads the pgbackrest configuration it writes.
    - role: backup_jobs
    - role: observability_agent
